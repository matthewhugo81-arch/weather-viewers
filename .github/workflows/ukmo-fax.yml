name: Weather charts and UKMO FAX archive
on:
  schedule:
    # Check staggered chart arrivals; GitHub scheduling remains best effort.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ukmo-fax-archive/**'
      - '.github/workflows/ukmo-fax.yml'
      - 'Wetterzentrale_Model_Viewer.html'
      - 'UK_Model_Viewer.html'
      - 'Satellite_Image_Viewer.html'
      - 'wetterzentrale/**'
      - 'satellite-overlays/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ukmo-fax-publisher
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install locked collector dependencies
        working-directory: ukmo-fax-archive
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Collect originals and read printed dates
        id: collect
        continue-on-error: true
        working-directory: ukmo-fax-archive
        run: node scripts/collect-online.cjs
      - name: Retain current products and comparison history
        working-directory: ukmo-fax-archive
        run: node scripts/retain-archive.cjs
      - name: Validate saved archive
        working-directory: ukmo-fax-archive
        run: |
          node scripts/validate.cjs
          node scripts/test-loading.cjs
          node scripts/test-refresh.cjs
          node scripts/test-products.cjs
      - name: Save images and manifest in repository history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukmo-fax-archive/archive
          if ! git diff --cached --quiet; then
            git commit -m 'Archive UKMO FAX charts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Restore verified Wetterzentrale snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            wetterzentrale/availability.json
            wetterzentrale/charts
            wetterzentrale/eng.traineddata
          key: wz-printed-dates-v1-${{ github.run_id }}
          restore-keys: wz-printed-dates-v1-
      - name: Install and test Wetterzentrale date checker
        working-directory: wetterzentrale
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node --test test.cjs
      - name: Read printed model dates and retain verified snapshots
        id: wetterzentrale
        continue-on-error: true
        working-directory: wetterzentrale
        run: node check-availability.cjs
      - name: Cache verified Wetterzentrale snapshots
        if: steps.wetterzentrale.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            wetterzentrale/availability.json
            wetterzentrale/charts
            wetterzentrale/eng.traineddata
          key: wz-printed-dates-v1-${{ github.run_id }}
      - name: Set up Python for satellite contours
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Restore ECMWF contour cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            satellite-overlays/.cache
            satellite-overlays/latest.json
          key: satellite-ecmwf-v1-${{ github.run_id }}
          restore-keys: satellite-ecmwf-v1-
      - name: Refresh satellite ECMWF contours
        id: satellite_contours
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m pip install --disable-pip-version-check -r satellite-overlays/requirements.txt
          python satellite-overlays/generate.py
      - name: Save ECMWF contour cache
        if: steps.satellite_contours.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            satellite-overlays/.cache
            satellite-overlays/latest.json
          key: satellite-ecmwf-v1-${{ github.run_id }}
      - name: Check existing publishing configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"
          mode=$(jq -r '.build_type // "legacy"' "$RUNNER_TEMP/pages.json")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != workflow ]; then
            echo "Set Settings > Pages > Source to GitHub Actions before publishing verified model snapshots." >&2
            exit 1
          fi
          echo "url=$(jq -r '.html_url' "$RUNNER_TEMP/pages.json")" >> "$GITHUB_OUTPUT"
      - name: Stage all existing viewers for Actions-based Pages
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('wetterzentrale/availability.json','utf8'));
          if(m.schema!==1||m.ceiling!==240||!Object.keys(m.charts).length)throw Error('Verified chart snapshot is missing');
          for(const c of Object.values(m.charts)){
            if(!/^[a-f0-9]{64}$/.test(c.sha))throw Error('Invalid snapshot filename');
            const bytes=fs.readFileSync('wetterzentrale/charts/'+c.sha+'.png');
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==c.sha)throw Error('Snapshot content hash mismatch');
          }
          NODE
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='_site/' --exclude='*.traineddata*' --exclude='.cache/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.mode == 'workflow'
        id: deploy
      - name: Verify public manifest catches up
        env:
          SITE_URL: ${{ steps.pages.outputs.url }}
        run: |
          expected=$(node -p "require('./wetterzentrale/availability.json').checkedAt")
          for attempt in $(seq 1 24); do
            if curl --fail --silent "${SITE_URL%/}/wetterzentrale/availability.json?check=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live.json"; then
              actual=$(jq -r '.checkedAt' "$RUNNER_TEMP/live.json")
              if [ "$actual" = "$expected" ]; then exit 0; fi
            fi
            sleep 15
          done
          echo 'The repository was updated, but the public manifest did not catch up.' >&2
          exit 1
      - name: Choose weekly backup
        id: backup
        if: (always())
        run: |
          if [ "$(date -u +%u-%H)" = '7-03' ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: (always() && steps.backup.outputs.save == 'true')
        with:
          name: ukmo-fax-backup-${{ github.run_id }}
          path: ukmo-fax-archive/archive/
          retention-days: 90
      - name: Surface incomplete collection
        if: (steps.collect.outcome == 'failure')
        run: |
          echo 'Some downloads or date readings need attention; successful captures were saved and published.' >&2
          exit 1



      - name: Surface a failed model-date check
        if: steps.wetterzentrale.outcome == 'failure'
        run: |
          echo 'The model-date check failed. Any previous snapshot was retained; the viewer labels delayed snapshots with their actual dates.' >&2
          exit 1

